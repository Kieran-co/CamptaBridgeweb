name: Web account tests
on:
  pull_request:
  push:
    branches: [main, audit/reprise-20261017]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - name: Préparer les fichiers publics du site
        run: python3 scripts/package_site.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-web-${{ github.event.pull_request.head.sha || github.sha }}
          path: .build/ComptaBridge-pages-web.zip
          if-no-files-found: error
          retention-days: 14
